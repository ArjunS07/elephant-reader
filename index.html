<!doctype html>
<html lang="en" data-theme="warm" data-font="inter" data-align="left">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elephant</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none' stroke='currentColor' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round' style='color:%232c429e'%3E%3Cpath d='M5 19V13.5C5 9.5 8 7 12.5 7H16.5C19.8 7 22 9.2 22 12.2V16.5C22 18.2 23 19 24.3 19C25 19 25.5 18.5 25.5 17.8'/%3E%3Cpath d='M5 19H9V15.5H13.5V19H17.5V14.5'/%3E%3Cpath d='M13 10.5C11.2 10.5 10.5 12 10.8 13.8C11.1 15 12.3 15.3 13.5 14.5'/%3E%3Ccircle cx='18.2' cy='11.2' r='0.85' fill='currentColor' stroke='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,600;0,700;1,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('elephant.prefs') || localStorage.getItem('field.prefs')
          if (!raw) return
          var p = JSON.parse(raw)
          var root = document.documentElement
          if (p.theme === 'light' || p.theme === 'warm' || p.theme === 'dark') {
            root.setAttribute('data-theme', p.theme)
          }
          if (p.fontFamily === 'inter' || p.fontFamily === 'lora' || p.fontFamily === 'newsreader') {
            root.setAttribute('data-font', p.fontFamily)
          }
          var size = Number(p.fontSize)
          if (size >= 15 && size <= 20) root.style.setProperty('--reading-size', size + 'px')
          var leading = Number(p.lineHeight)
          if (leading >= 1.5 && leading <= 1.85) root.style.setProperty('--reading-leading', String(leading))
          var cols = { cozy: '600px', standard: '672px', wide: '760px', narrow: '600px', default: '672px' }
          if (cols[p.columnWidth]) root.style.setProperty('--column', cols[p.columnWidth])
          if (p.align === 'left' || p.align === 'center') root.setAttribute('data-align', p.align)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
